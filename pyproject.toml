[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetweft"
version = "0.1.0"
description = "Experimental durable coordination for small edge application rollouts"
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
fleetweft = "fleetweft.mvp:main"

[tool.setuptools.packages.find]
include = ["fleetweft*"]
